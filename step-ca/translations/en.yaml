configuration:
  ca_name:
    name: CA name
    description: >-
      Name used in the root and intermediate CA subjects. Only applied when
      the CA is first created.
  certificate_subject:
    name: Certificate subject
    description: >-
      Fields added to the CA certificates (on creation) and to every issued
      certificate. A group's OU replaces the OU here.
    fields:
      organization:
        name: Organization (O)
      organizational_unit:
        name: Organizational unit (OU)
        description: >-
          OU for certificates from the default SCEP URL. Groups set their own.
      locality:
        name: Locality (L)
      state:
        name: State or province (ST)
      country:
        name: Country (C)
        description: Two-letter uppercase country code, for example US.
  dns_names:
    name: DNS names
    description: >-
      Hostnames and IP addresses in step-ca's own HTTPS certificate. Only
      needed for the direct port 9000.
  scep_provisioner_name:
    name: SCEP provisioner name
    description: Last part of the default SCEP URL, …/api/step_ca_scep/scep/<name>.
  scep_challenge:
    name: SCEP challenge
    description: >-
      Shared password devices send to the default SCEP URL. If empty, anyone
      who can reach the URL can get a certificate.
  groups:
    name: Certificate groups
    description: >-
      Groups such as adults, kids, and guests. Each has its own SCEP URL
      (…/scep/<name>), OU, challenge, and lifetime. Easier to edit under
      Certificates → Tools → Certificate groups.
    fields:
      name:
        name: Name
        description: >-
          Lowercase letters, digits, - and _. Used in the group's SCEP URL.
      organizational_unit:
        name: Organizational unit (OU)
        description: Every certificate in the group gets this OU.
      challenge:
        name: Challenge
        description: >-
          The group's SCEP challenge for MDMs. Leave empty to accept only
          one-time enrollment links.
      cert_duration:
        name: Certificate lifetime
        description: >-
          Optional default and maximum lifetime, for example 720h. Empty uses
          the add-on's lifetimes.
      require_email:
        name: Require an email address
        description: >-
          Refuse certificates without an email subject alternative name, for
          example when a RADIUS server matches it against the user's UPN.
  encryption_algorithm:
    name: SCEP encryption algorithm
    description: >-
      0 DES-CBC, 1 AES-128-CBC, 2 AES-256-CBC (default), 3 AES-128-GCM,
      4 AES-256-GCM. Use 0 only for legacy clients.
  min_public_key_length:
    name: Minimum RSA key size
    description: Smallest RSA key accepted from devices.
  include_root:
    name: Include the root CA
    description: Include the root CA in the GetCACert response.
  force_cn:
    name: Add the CN to the SANs
    description: Always add the Common Name to the certificate's subject alternative names.
  default_cert_duration:
    name: Default certificate lifetime
    description: For example 8760h (one year).
  max_cert_duration:
    name: Maximum certificate lifetime
    description: Must be at least the default lifetime.
  install_integration:
    name: Install the integration
    description: >-
      Copy the Step CA SCEP integration into custom_components on start.
      Turn off if you manage it yourself.
  database:
    name: Database
    description: >-
      mariadb stores Step CA records and resident iPSK portal data in the
      MariaDB add-on. embedded uses Step CA's built-in database and cannot be
      shared with resident onboarding.
  mariadb_database:
    name: MariaDB database name
    description: Do not use a database that something else uses.
  enrollment:
    name: Enrollment
    description: Enrollment links and the Home Assistant URL they use.
    fields:
      public_url:
        name: Public URL
        description: >-
          Overrides the detected Home Assistant URL, for example
          https://ha.example.com. Not normally needed.
      link_hours:
        name: Link lifetime (hours)
        description: How long enrollment links stay valid (1-168).
  resident_onboarding:
    name: Resident iPSK onboarding
    description: >-
      Move resident registration and iPSK management into Step CA. Resident
      records are stored in the same MariaDB database; Step CA remains the only CA.
      Registration starts through the default-PSK captive portal and blocks private MAC addresses.
    fields:
      enabled:
        name: Enable the public resident portal
      invite_required:
        name: Require an invitation code
      network_id:
        name: Meraki network ID
        description: Network used when a resident registers.
      ssid_number:
        name: SSID number
        description: Meraki SSID used for resident iPSKs.
      group_policy_id:
        name: Registered-resident group policy ID
        description: >-
          Required when onboarding is enabled. Meraki policy applied to individual resident keys. Use splash bypass;
          keep the default setup key on a separate restricted captive portal policy.
      duration_hours:
        name: iPSK lifetime in hours
        description: Set to 0 for keys without an expiry.
      guest_ssid:
        name: Guest QR network name
        description: The existing Wi-Fi network guests join by scanning the guest QR.
      guest_psk:
        name: Guest QR password
        description: Existing guest PSK or iPSK, configured in Meraki with splash bypass.
      setup_ssid:
        name: Registration QR network name
        description: The existing setup network used to open resident registration.
      setup_psk:
        name: Registration QR password
        description: Existing default setup PSK or iPSK, configured to use the captive portal.
      self_service_enabled:
        name: Allow residents to add other devices
        description: Residents can create an individual device key and download its join QR.
      sign_in_required:
        name: Require Duo verification
        description: Use Duo Universal SDK factor verification for permitted group members. This is not primary password SSO.
      no_sign_in_user_list:
        name: Show group-only resident list without sign-in
        description: Selecting a group member attributes a new key but does not verify identity or reveal existing passwords.
      max_devices_per_resident:
        name: Device limit per resident
        description: Administrators can revoke or delete a self-service key here to release its device slot.
      duo_client_id:
        name: Duo Web SDK client ID
      duo_client_secret:
        name: Duo Web SDK client secret
      duo_api_hostname:
        name: Duo Web SDK API hostname
      duo_redirect_uri:
        name: Public Duo callback URL
        description: Public HTTPS Home Assistant URL ending in /api/step_ca_scep/portal?action=duo_callback.
      duo_admin_integration_key:
        name: Duo Admin API integration key
      duo_admin_secret:
        name: Duo Admin API secret
      duo_admin_hostname:
        name: Duo Admin API hostname
      duo_group_id:
        name: Permitted Duo resident group ID
        description: Required for verification and the selector. The portal never retrieves the full tenant user list.
  profile_signing:
    name: Profile signing
    description: >-
      Publicly trusted certificate in /ssl for signing Apple profiles, such
      as the one from the Let's Encrypt add-on.
    fields:
      ssl_certificate:
        name: Certificate file
        description: File name in /ssl.
      ssl_key:
        name: Key file
        description: File name in /ssl.
  wifi:
    name: Wi-Fi (older single network)
    description: >-
      The single network from earlier versions, used only while Wi-Fi networks is empty. Saving in
      the panel under Tools > Wi-Fi networks moves it there.
    fields:
      ssid:
        name: SSID
        description: Network name.
      authentication:
        name: Authentication
        description: >-
          eap_tls: devices sign in with the certificate from this CA (WPA Enterprise).
          peap, eap_ttls, eap_fast: RADIUS account credentials. eap_sim and eap_aka:
          compatible carrier SIM. leap: legacy only. psk: shared network password.
      password:
        name: Password
        description: The network password when authentication is psk (8 to 63 characters).
      security:
        name: Security
      hidden:
        name: Hidden network
        description: The network does not broadcast its name.
      auto_join:
        name: Join automatically
      disable_mac_randomization:
        name: Fixed Wi-Fi address
        description: >-
          Turns off Private Wi-Fi Address (MAC randomization) for this network on iOS 14 and
          macOS 15 or later, so devices use their real MAC address.
      radius_server:
        name: RADIUS server
        description: >-
          custom: your own RADIUS server; add its CA under Tools > Other trusted CAs and set the
          server names. meraki_access_manager: devices trust Meraki Access Manager's RADIUS
          certificate (eap.meraki.com) without an upload.
      radius_server_names:
        name: RADIUS server names
        description: >-
          Optional. Pins which RADIUS server certificate names devices accept. Not needed with your
          own CA or meraki_access_manager.
  wifi_networks:
    name: Wi-Fi networks
    description: >-
      Wi-Fi networks added to Apple profiles, with proxy, captive portal, QoS, and Passpoint
      settings. Easiest to edit in the panel under Tools > Wi-Fi networks, where
      each network can have its own profile name so one SSID can be set up more than once.
    fields:
      authentication:
        name: Authentication
        description: EAP-TLS, PEAP, EAP-TTLS, EAP-FAST, SIM/AKA, legacy LEAP, or a shared password.
      eap_username:
        name: 802.1X user name
        description: Empty prompts on the device for password methods; EAP-TLS defaults to the certificate name.
      eap_password:
        name: 802.1X password
        description: Optional. Included in downloaded profiles. Empty prompts on the device.
      eap_outer_identity:
        name: Outer identity
        description: Hides the account name outside the PEAP, TTLS, or FAST tunnel.
      eap_password_per_connection:
        name: Ask for a password on every connection
      eap_client_certificate:
        name: Also require the device certificate
      ttls_inner_authentication:
        name: TTLS inner authentication
      tls_minimum:
        name: Minimum TLS version
      tls_maximum:
        name: Maximum TLS version
      eap_fast_use_pac:
        name: Use a Protected Access Credential (PAC)
      eap_fast_provision_pac:
        name: Provision PAC from the server
      eap_sim_rands:
        name: Minimum SIM challenges (RANDs)
