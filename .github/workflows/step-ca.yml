name: Step CA compatibility

on:
  push:
    branches: [master, main]
    paths: ['step-ca/**', '.github/workflows/step-ca.yml']
  pull_request:
    paths: ['step-ca/**', '.github/workflows/step-ca.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-and-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Portal tests and real Home Assistant companion compatibility
        run: |
          runtime=(uv run --no-project --python 3.14 --with homeassistant==2026.9.4 --with aiohasupervisor==0.6.0 --with duo-universal==2.3.1 --with duo-client==5.7.0 --with meraki==4.5.0b4 --with pymysql --with qrcode --with cryptography)
          "${runtime[@]}" python -m unittest discover -s step-ca/tests -p 'test_*.py'
          "${runtime[@]}" python step-ca/tests/homeassistant_integration.py
